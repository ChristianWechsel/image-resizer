steps:
  - name: "node:24"
    entrypoint: "npm"
    args: ["audit", "--audit-level=high"]

  - name: "node:24"
    entrypoint: "npm"
    args: ["ci"]

  - name: "node:24"
    entrypoint: "npm"
    args: ["test"]

  - name: "node:24"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        VERSION=$(node -p "require('./package.json').version")
        echo "$$VERSION" > /workspace/_version.txt
        echo "Building version $$VERSION"

  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        VERSION=$(cat /workspace/_version.txt)
        IMAGE="$LOCATION-docker.pkg.dev/$PROJECT_ID/${_GAR_REPOSITORY}/${_GAR_IMAGE_NAME}"
        docker build \
          --network=cloudbuild \
          -t "$$IMAGE:$$VERSION" \
          -t "$$IMAGE:latest" \
          .
        docker push "$$IMAGE:$$VERSION"
        docker push "$$IMAGE:latest"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_GAR_IMAGE_NAME}"
      - "--image=$LOCATION-docker.pkg.dev/$PROJECT_ID/${_GAR_REPOSITORY}/${_GAR_IMAGE_NAME}:latest"
      - "--region=$LOCATION"
      - "--allow-unauthenticated"
      - "--service-account=${_GAR_IMAGE_NAME}-runner-sa@$PROJECT_ID.iam.gserviceaccount.com"

options:
  logging: CLOUD_LOGGING_ONLY
